name: Extract & Decompile RG43V-Pro DTB

on:
  workflow_dispatch:

jobs:
  extract-and-decompile:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: System-Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl p7zip-full p7zip-rar xz-utils util-linux device-tree-compiler python3-pip fdisk coreutils
          pip3 install --upgrade pip
          pip3 install gdown requests

      - name: Firmware von Google Drive herunterladen (Robuster Download)
        run: |
          echo "Lade EmuELEC Firmware für RG43V-Pro herunter..."
          FILE_ID="1h7hc3wwdCgFMogr7Fi-W8EeQwp279Ipm"
          
          gdown --fuzzy --id "$FILE_ID" -O firmware_archive || true
          
          if [ ! -f "firmware_archive" ] || [ ! -s "firmware_archive" ]; then
            echo "Versuche alternativen Google Drive Direkt-Download..."
            CONFIRM=$(wget --save-cookies cookies.txt --keep-session-cookies --no-check-certificate -qO- "https://docs.google.com/uc?export=download&id=$FILE_ID" | grep -o 'confirm=[^&]*' | head -n 1)
            wget --load-cookies cookies.txt "https://docs.google.com/uc?export=download&confirm=$CONFIRM&id=$FILE_ID" -O firmware_archive || true
          fi
          
          if [ ! -f "firmware_archive" ] || [ ! -s "firmware_archive" ]; then
            echo "Fehler: Download der Firmware endgültig fehlgeschlagen!"
            exit 1
          fi
          echo "Firmware erfolgreich heruntergeladen. Dateigröße:"
          ls -lh firmware_archive

      - name: Image-Datei entpacken und echtes Haupt-Image identifizieren
        run: |
          mkdir -p extracted_img
          echo "Prüfe Archiv-Typ und entpacke..."
          
          if 7z l firmware_archive > /dev/null 2>&1; then
            7z x firmware_archive -oextracted_img/
          elif gzip -t firmware_archive > /dev/null 2>&1; then
            gunzip -c firmware_archive > extracted_img/firmware.img
          elif xz -t firmware_archive > /dev/null 2>&1; then
            unxz -c firmware_archive > extracted_img/firmware.img
          else
            mv firmware_archive extracted_img/firmware.img
          fi
          
          echo "Alle gefundenen .img Dateien im Archiv:"
          find extracted_img -type f -name "*.img" -ls
          
          # WICHTIG: Wir nehmen nicht mehr die erstbeste, sondern die GRÖSSTE .img Datei (das echte Image, keine kleinen Loader)
          IMG_FILE=$(find extracted_img -type f -name "*.img" -printf "%s %p\n" | sort -nr | head -n 1 | awk '{print $2}')
          
          if [ -z "$IMG_FILE" ] || [ ! -f "$IMG_FILE" ]; then
            echo "Fehler: Keine gültige .img Datei im Archiv gefunden!"
            exit 1
          fi
          
          echo "Ausgewähltes Haupt-Image: $IMG_FILE"
          ls -lh "$IMG_FILE"
          echo "IMG_FILE=$IMG_FILE" >> $GITHUB_ENV

      - name: Partitionen analysieren und per Offset mounten
        run: |
          mkdir -p dtb_output
          mkdir -p boot_mnt
          
          IMG="${{ env.IMG_FILE }}"
          echo "Analysiere Partitionstabelle von: $IMG"
          
          fdisk -l "$IMG"
          
          MOUNTED=false
          
          # Automatisches Auslesen der Startsektoren über fdisk
          while read -r start_sect; do
            if [[ "$start_sect" =~ ^[0-9]+$ ]]; then
              OFFSET=$((start_sect * 512))
              echo "Teste Partition mit Startsektor $start_sect (Offset: $OFFSET Bytes)..."
              
              if sudo mount -o loop,offset=$OFFSET "$IMG" boot_mnt 2>/dev/null; then
                echo "Erfolgreich gemountet mit Offset $OFFSET!"
                
                if find boot_mnt -name "*.dtb" -o -name "dtb.img" -o -name "*.dtsi" | grep -q .; then
                  echo "Boot-Partition anhand von DTB-Inhalten identifiziert!"
                  MOUNTED=true
                  break
                else
                  echo "Keine DTB-Inhalte in diesem Offset, unmounten..."
                  sudo umount boot_mnt || true
                fi
              fi
            fi
          done <<EOF
          $(fdisk -l "$IMG" | awk 'NR>7 {print $2}')
          EOF
          
          # Fallback für feste Standard-Offsets bei eMMC-Images
          if [ "$MOUNTED" = false ]; then
            echo "Automatischer Offset fehlgeschlagen, teste bekannte Standard-Offsets..."
            for sect in 16384 32768 8192 2048 65536 1024; do
              OFFSET=$((sect * 512))
              echo "Teste festen Offset: $OFFSET Bytes..."
              if sudo mount -o loop,offset=$OFFSET "$IMG" boot_mnt 2>/dev/null; then
                if find boot_mnt -name "*.dtb" -o -name "dtb.img" -o -name "*.dtsi" | grep -q .; then
                  echo "Boot-Partition mit festem Offset $OFFSET gefunden!"
                  MOUNTED=true
                  break
                else
                  sudo umount boot_mnt || true
                fi
              fi
            done
          fi
          
          if [ "$MOUNTED" = false ]; then
            echo "Fehler: Konnte keine Partition mit Offset mounten."
            exit 1
          fi
          
          echo "Kopiere alle .dtb und .dtsi Dateien..."
          find boot_mnt -type f \( -name "*.dtb" -o -name "*.dtsi" \) -exec cp {} dtb_output/ \; 2>/dev/null || true
          
          if [ -f "boot_mnt/dtb.img" ]; then
            echo "Aktive dtb.img gefunden!"
            cp boot_mnt/dtb.img dtb_output/active_rg43v_pro.dtb
          fi
          
          echo "Inhalt des Ausgabeordners:"
          ls -la dtb_output/
          
          sudo umount boot_mnt || true

      - name: DTB zu DTS dekompilieren
        run: |
          mkdir -p dts_output
          FOUND_DTB=false
          
          for dtb in dtb_output/*.dtb; do
            if [ -f "$dtb" ]; then
              FOUND_DTB=true
              filename=$(basename -- "$dtb")
              name="${filename%.*}"
              echo "Dekompiliere $filename zu DTS..."
              dtc -I dtb -O dts -o "dts_output/${name}.dts" "$dtb" || echo "Warnung: Fehler beim Dekompilieren von $dtb"
            fi
          done
          
          if [ "$FOUND_DTB" = false ]; then
            echo "Warnung: Keine .dtb Dateien zum Dekompilieren gefunden!"
          fi

      - name: Ergebnisse als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: rg43v-pro-dts-analysis
          path: |
            dtb_output/
            dts_output/ 
