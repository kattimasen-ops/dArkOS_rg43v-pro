name: Extract & Decompile RG43V-Pro DTB

on:
  workflow_dispatch:

jobs:
  extract-and-decompile:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: System-Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl p7zip-full p7zip-rar xz-utils kpartx device-tree-compiler python3-pip util-linux
          pip3 install --upgrade pip
          pip3 install gdown

      - name: Firmware von Google Drive herunterladen
        run: |
          echo "Lade EmuELEC Firmware für RG43V-Pro herunter..."
          gdown --fuzzy "https://drive.google.com/file/d/1h7hc3wwdCgFMogr7Fi-W8EeQwp279Ipm/view?usp=sharing" -O firmware_archive
          
          if [ ! -f "firmware_archive" ] || [ ! -s "firmware_archive" ]; then
            echo "Fehler: Download fehlgeschlagen oder Datei ist leer!"
            exit 1
          fi

      - name: Image-Datei entpacken
        run: |
          mkdir -p extracted_img
          echo "Prüfe Archiv-Typ und entpacke..."
          
          if 7z l firmware_archive > /dev/null 2>&1; then
            7z x firmware_archive -oextracted_img/
          elif gzip -t firmware_archive > /dev/null 2>&1; then
            gunzip -c firmware_archive > extracted_img/firmware.img
          elif xz -t firmware_archive > /dev/null 2>&1; then
            unxz -c firmware_archive > extracted_img/firmware.img
          else
            mv firmware_archive extracted_img/firmware.img
          fi
          
          IMG_FILE=$(find extracted_img -type f -name "*.img" | head -n 1)
          if [ -z "$IMG_FILE" ] || [ ! -f "$IMG_FILE" ]; then
            echo "Fehler: Keine .img Datei im Archiv gefunden!"
            exit 1
          fi
          echo "Gefundenes Image: $IMG_FILE"
          echo "IMG_FILE=$IMG_FILE" >> $GITHUB_ENV

      - name: Image mounten und DTB/DTSI extrahieren
        run: |
          mkdir -p dtb_output
          mkdir -p boot_mnt
          
          IMG="${{ env.IMG_FILE }}"
          echo "Verwende Image: $IMG"
          
          # Loop-Device zuweisen
          LOOP_DEV=$(sudo losetup --find --show --partscan "$IMG")
          echo "Loop-Device erstellt: $LOOP_DEV"
          
          # Partitionen ermitteln
          PARTITIONS=$(ls ${LOOP_DEV}p* 2>/dev/null || true)
          if [ -z "$PARTITIONS" ]; then
            # Fallback falls partscan nicht sofort greift
            sudo kpartx -av "$IMG"
            sleep 2
            LOOP_NAME=$(basename "$LOOP_DEV")
            PARTITIONS=$(ls /dev/mapper/${LOOP_NAME}p* 2>/dev/null || true)
          fi
          
          echo "Gefundene Partitionen: $PARTITIONS"
          
          MOUNTED=false
          for part in $PARTITIONS; do
            echo "Versuche Partition zu mounten: $part"
            if sudo mount "$part" boot_mnt 2>/dev/null; then
              echo "Erfolgreich gemountet: $part"
              # Prüfen ob DTB-Inhalte vorhanden sind
              if find boot_mnt -name "*.dtb" -o -name "dtb.img" -o -name "*.dtsi" | grep -q .; then
                echo "Boot-Partition erfolgreich identifiziert!"
                MOUNTED=true
                break
              else
                echo "Keine DTB-Dateien in diesem Pfad, unmounten..."
                sudo umount boot_mnt || true
              fi
            fi
          done
          
          # Falls keine Partition spezifisch erkannt wurde, erzwinge das Mounten der ersten Partition
          if [ "$MOUNTED" = false ]; then
            FIRST_PART=$(echo $PARTITIONS | awk '{print $1}')
            if [ -n "$FIRST_PART" ]; then
              echo "Fallback: Versuche erzwingen des Mountens von $FIRST_PART"
              sudo mount "$FIRST_PART" boot_mnt && MOUNTED=true || true
            fi
          fi
          
          if [ "$MOUNTED" = false ]; then
            echo "Fehler: Konnte keine Boot-Partition mounten."
            sudo losetup -d "$LOOP_DEV" || true
            exit 1
          fi
          
          echo "Kopiere alle .dtb und .dtsi Dateien..."
          find boot_mnt -type f \( -name "*.dtb" -o -name "*.dtsi" \) -exec cp {} dtb_output/ \; 2>/dev/null || true
          
          if [ -f "boot_mnt/dtb.img" ]; then
            echo "Aktive dtb.img gefunden!"
            cp boot_mnt/dtb.img dtb_output/active_rg43v_pro.dtb
          fi
          
          echo "Inhalt des Ausgabeordners:"
          ls -la dtb_output/
          
          # Aufräumen
          sudo umount boot_mnt || true
          sudo losetup -d "$LOOP_DEV" || true
          sudo kpartx -d "$IMG" 2>/dev/null || true

      - name: DTB zu DTS dekompilieren
        run: |
          mkdir -p dts_output
          FOUND_DTB=false
          
          for dtb in dtb_output/*.dtb; do
            if [ -f "$dtb" ]; then
              FOUND_DTB=true
              filename=$(basename -- "$dtb")
              name="${filename%.*}"
              echo "Dekompiliere $filename zu DTS..."
              dtc -I dtb -O dts -o "dts_output/${name}.dts" "$dtb" || echo "Warnung: Fehler beim Dekompilieren von $dtb"
            fi
          done
          
          if [ "$FOUND_DTB" = false ]; then
            echo "Warnung: Keine .dtb Dateien zum Dekompilieren gefunden!"
          fi

      - name: Ergebnisse als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: rg43v-pro-dts-analysis
          path: |
            dtb_output/
            dts_output/
