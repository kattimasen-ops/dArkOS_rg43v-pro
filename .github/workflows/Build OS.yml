name: Extract & Decompile RG43V-Pro DTB

on:
  workflow_dispatch:
    inputs:
      file_id:
        description: "Google Drive File-ID der EmuELEC-Firmware (Override, optional)"
        required: false
        default: "1h7hc3wwdCgFMogr7Fi-W8EeQwp279Ipm"

permissions:
  contents: write   # noetig, damit der Commit/Push-Schritt am Ende mit dem
                     # eingebauten GITHUB_TOKEN ins Repo schreiben darf

jobs:
  extract-and-decompile:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: System-Abhängigkeiten installieren
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y wget curl p7zip-full p7zip-rar xz-utils util-linux \
            device-tree-compiler python3-pip fdisk kpartx
          # Ubuntu 24.04-Runner haben ein "externally-managed-environment" (PEP 668) -
          # ohne --break-system-packages schlägt pip3 install sonst fehl.
          pip3 install --upgrade pip --break-system-packages
          pip3 install gdown requests --break-system-packages

      - name: Firmware von Google Drive herunterladen (robuster Download mit Retry)
        env:
          FILE_ID: ${{ inputs.file_id }}
        run: |
          echo "Lade EmuELEC Firmware für RG43V-Pro herunter (File-ID: $FILE_ID)..."
          rm -f firmware_archive

          # Versuch 1: gdown mit der bekannten Share-URL (nicht --id mit --fuzzy mischen,
          # das ist in aktuellen gdown-Versionen kein gültiger Aufruf mehr).
          for attempt in 1 2 3; do
            echo "gdown-Versuch $attempt..."
            gdown --fuzzy "https://drive.google.com/file/d/${FILE_ID}/view" -O firmware_archive && break
            sleep 5
          done

          # Versuch 2: gdown direkt über die uc-URL (funktioniert manchmal, wenn --fuzzy scheitert)
          if [ ! -s firmware_archive ]; then
            echo "gdown --fuzzy fehlgeschlagen, versuche gdown mit uc-URL..."
            gdown "https://drive.google.com/uc?id=${FILE_ID}" -O firmware_archive || true
          fi

          # Versuch 3: manueller wget-Fallback für große Dateien, bei denen Google Drive
          # die "Kann nicht auf Viren geprüft werden"-Warnung zeigt. Google verlangt hierfür
          # inzwischen einfach "confirm=t" als Query-Parameter (kein Token-Scraping mehr nötig),
          # zusammen mit dem Session-Cookie aus dem ersten Request.
          if [ ! -s firmware_archive ]; then
            echo "Versuche manuellen Google-Drive-Download (confirm=t)..."
            wget --save-cookies cookies.txt --keep-session-cookies --no-check-certificate -q \
              "https://drive.google.com/uc?export=download&id=${FILE_ID}" -O /dev/null
            wget --load-cookies cookies.txt --no-check-certificate \
              "https://drive.google.com/uc?export=download&confirm=t&id=${FILE_ID}" \
              -O firmware_archive || true
            rm -f cookies.txt
          fi

          if [ ! -s firmware_archive ]; then
            echo "::error::Download der Firmware endgültig fehlgeschlagen (alle 3 Methoden)."
            exit 1
          fi

          # KRITISCHER SANITY-CHECK: Ein echtes EmuELEC-Image ist mehrere
          # hundert MB bis GB groß. Wenn Google Drive z.B. wegen
          # Download-Kontingent ("quota exceeded") oder fehlender
          # Freigabe nur eine kleine HTML-Fehlerseite zurückgibt, wird die
          # trotzdem "erfolgreich" heruntergeladen (Datei ist ja nicht leer!)
          # - nur eben Datenmüll. Ohne diese Prüfung läuft der Workflow
          # bis zur Partitionssuche durch und scheitert dort mit einer
          # verwirrenden "keine Partition gefunden"-Meldung.
          FW_SIZE=$(stat -c%s firmware_archive)
          MIN_SIZE=$((20*1024*1024))  # 20 MB
          if [ "$FW_SIZE" -lt "$MIN_SIZE" ]; then
            echo "::error::Download ist verdächtig klein (${FW_SIZE} Bytes) - das ist keine echte Firmware, vermutlich eine Google-Drive-Fehler-/Quota-Seite."
            echo "--- Inhalt der Datei (falls Text/HTML) ---"
            head -c 4000 firmware_archive | strings | head -60
            echo "--- Mögliche Ursachen: Datei nicht auf 'Jeder mit Link' freigegeben, Tages-Downloadkontingent von Google Drive für diese Datei erschöpft, oder falsche FILE_ID ---"
            exit 1
          fi

          echo "Firmware erfolgreich heruntergeladen. Dateigröße:"
          ls -lh firmware_archive
          file firmware_archive || true

      - name: Image-Datei entpacken
        run: |
          set -e
          mkdir -p extracted_img
          echo "Prüfe Archiv-Typ und entpacke..."

          if 7z l firmware_archive > /dev/null 2>&1; then
            7z x firmware_archive -oextracted_img/
          elif gzip -t firmware_archive > /dev/null 2>&1; then
            gunzip -c firmware_archive > extracted_img/firmware.img
          elif xz -t firmware_archive > /dev/null 2>&1; then
            unxz -c firmware_archive > extracted_img/firmware.img
          else
            # Kein bekanntes Archivformat -> vermutlich schon ein rohes .img
            mv firmware_archive extracted_img/firmware.img
          fi

          # Case-insensitive suchen (.img / .IMG) und notfalls die größte Datei
          # im Ordner nehmen, falls der Hersteller eine andere Endung nutzt
          # (z.B. .PARTITION, kein Suffix, o.ä.).
          IMG_FILE=$(find extracted_img -type f -iname "*.img" | head -n 1)
          if [ -z "$IMG_FILE" ]; then
            echo "Keine *.img gefunden, nehme größte Datei im Archiv als Image an..."
            IMG_FILE=$(find extracted_img -type f -printf '%s %p\n' | sort -rn | head -n 1 | cut -d' ' -f2-)
          fi
          if [ -z "$IMG_FILE" ] || [ ! -f "$IMG_FILE" ]; then
            echo "::error::Keine verwertbare Image-Datei im Archiv gefunden!"
            find extracted_img -type f
            exit 1
          fi
          echo "Gefundenes Image: $IMG_FILE"

          # Gleicher Sanity-Check wie nach dem Download, diesmal auf das
          # entpackte Image: verhindert genau den Fehler aus deinem Log
          # ("Disk ...: 2 KiB, 2048 bytes, 4 sectors") - ein 2KB-"Image"
          # kann niemals eine echte Partitionstabelle mit Boot-Partition
          # enthalten, also lieber hier sofort klar abbrechen.
          IMG_SIZE=$(stat -c%s "$IMG_FILE")
          MIN_IMG_SIZE=$((50*1024*1024))  # 50 MB
          if [ "$IMG_SIZE" -lt "$MIN_IMG_SIZE" ]; then
            echo "::error::Entpacktes Image ist unrealistisch klein (${IMG_SIZE} Bytes / $(numfmt --to=iec $IMG_SIZE 2>/dev/null || echo '?')) - das kann kein vollständiges Firmware-Image sein."
            file "$IMG_FILE" || true
            echo "--- Inhalt (falls Text) ---"
            head -c 2000 "$IMG_FILE" | strings | head -30
            echo "--- Prüfe den vorherigen Download-Schritt bzw. das Archivformat - die Extraktion ist vermutlich fehlgeschlagen oder das Archiv war unvollständig ---"
            exit 1
          fi
          echo "Image-Größe OK: ${IMG_SIZE} Bytes"
          echo "IMG_FILE=$IMG_FILE" >> "$GITHUB_ENV"

      - name: Partitionen per Loop-Device einbinden und DTB suchen
        run: |
          mkdir -p dtb_output boot_mnt
          IMG="${{ env.IMG_FILE }}"
          echo "Partitionstabelle von: $IMG"
          fdisk -l "$IMG" || true

          # Statt Startsektoren manuell aus "fdisk -l" zu parsen (bricht bei GPT-Images,
          # bei der Boot-Flag-Spalte "*" bei MBR, und bei wechselnder Kopfzeilenzahl),
          # nutzen wir losetup -P: der Kernel erstellt automatisch /dev/loopXpN für
          # jede Partition, egal ob MBR oder GPT. Das ist deutlich robuster.
          LOOP_DEV=$(sudo losetup -Pf --show "$IMG")
          echo "Image als $LOOP_DEV eingebunden, warte auf Partitions-Nodes..."
          sudo partprobe "$LOOP_DEV" 2>/dev/null || true
          sleep 2
          ls -la "${LOOP_DEV}"p* 2>/dev/null || true

          MOUNTED=false
          for part in "${LOOP_DEV}"p*; do
            [ -b "$part" ] || continue
            echo "Teste Partition $part ..."
            if sudo mount -o ro "$part" boot_mnt 2>/dev/null; then
              if find boot_mnt -maxdepth 3 \( -iname "*.dtb" -o -iname "dtb.img" -o -iname "*.dtsi" \) 2>/dev/null | grep -q .; then
                echo "Boot-Partition gefunden: $part"
                MOUNTED=true
                break
              else
                sudo umount boot_mnt || sudo umount -l boot_mnt || true
              fi
            fi
          done

          if [ "$MOUNTED" = false ]; then
            echo "::warning::Keine Partition mit DTB-Inhalten gefunden (vermutlich kein rohes partitioniertes Image, z.B. ein proprietäres Amlogic-Update-Package). Fallback: Signatur-Scan im nächsten Schritt übernimmt."
          else
            echo "Kopiere alle .dtb und .dtsi Dateien..."
            find boot_mnt -type f \( -iname "*.dtb" -o -iname "*.dtsi" \) -exec cp {} dtb_output/ \; 2>/dev/null || true

            if [ -f "boot_mnt/dtb.img" ]; then
              echo "Aktive dtb.img gefunden!"
              cp boot_mnt/dtb.img dtb_output/active_rg43v_pro.dtb
            fi

            sudo umount boot_mnt || sudo umount -l boot_mnt || true
          fi

          echo "Inhalt des Ausgabeordners nach Partitions-Suche:"
          ls -la dtb_output/ || true

          sudo losetup -d "$LOOP_DEV" || true

      - name: Fallback - DTB per Signatur-Scan direkt im Image finden
        # Läuft immer (auch wenn der vorherige Schritt bereits etwas fand) und
        # ergänzt zusätzliche Treffer. Notwendig für Firmware-Formate ohne
        # normale Partitionstabelle, z.B. proprietäre Amlogic-"UPDATE.img"-
        # Burning-Tool-Pakete (eigenes Item-Container-Format statt MBR/GPT) -
        # genau das, was RG43V_Pro_..._EMMC_update.img ist.
        #
        # Vorgehen: Das Device-Tree-Blob-Format hat laut Spezifikation immer
        # eine feste 4-Byte-Magic 0xd00dfeed am Anfang, gefolgt von einem
        # 4-Byte-Big-Endian "totalsize"-Feld. Wir scannen das rohe Image nach
        # dieser Signatur, schneiden mit der im Header stehenden Größe exakt
        # aus und validieren jeden Treffer mit "dtc" (verwirft Zufallstreffer).
        # Das funktioniert unabhängig vom umgebenden Container-Format.
        run: |
          mkdir -p dtb_output
          IMG="${{ env.IMG_FILE }}"
          cat > /tmp/extract_dtb_by_signature.py << 'PYEOF'
          import sys, os, mmap, struct, subprocess

          img_path = sys.argv[1]
          outdir = sys.argv[2]
          os.makedirs(outdir, exist_ok=True)

          MAGIC = b'\xd0\x0d\xfe\xed'
          MIN_DTB_SIZE = 4 * 1024
          MAX_DTB_SIZE = 16 * 1024 * 1024

          found = []
          with open(img_path, 'rb') as f:
              mm = mmap.mmap(f.fileno(), 0, access=mmap.ACCESS_READ)
              size = len(mm)
              pos = 0
              while True:
                  idx = mm.find(MAGIC, pos)
                  if idx == -1:
                      break
                  if idx + 8 <= size:
                      totalsize = struct.unpack('>I', mm[idx+4:idx+8])[0]
                      if MIN_DTB_SIZE <= totalsize <= MAX_DTB_SIZE and idx + totalsize <= size:
                          found.append((idx, totalsize))
                  pos = idx + 4

              print(f"Kandidaten mit gueltiger Magic + plausibler Groesse: {len(found)}")

              count = 0
              for idx, totalsize in found:
                  blob = mm[idx:idx + totalsize]
                  tmp_path = f"/tmp/_dtb_candidate_{idx}.dtb"
                  with open(tmp_path, 'wb') as out:
                      out.write(blob)
                  rc = subprocess.run(
                      ["dtc", "-I", "dtb", "-O", "dts", "-o", "/dev/null", tmp_path],
                      stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
                  ).returncode
                  if rc == 0:
                      count += 1
                      final_path = os.path.join(outdir, f"sig_offset_{idx}.dtb")
                      os.rename(tmp_path, final_path)
                      print(f"  OK: Offset {idx}, Groesse {totalsize} Bytes -> {final_path}")
                  else:
                      os.remove(tmp_path)

              mm.close()
          print(f"Insgesamt {count} valide DTB(s) per Signatur-Scan extrahiert.")
          sys.exit(0 if count > 0 else 1)
          PYEOF

          python3 /tmp/extract_dtb_by_signature.py "$IMG" dtb_output
          SIG_SCAN_RC=$?

          echo "Inhalt des Ausgabeordners nach Signatur-Scan:"
          ls -la dtb_output/

          if ! find dtb_output -type f \( -iname "*.dtb" \) 2>/dev/null | grep -q .; then
            echo "::error::Weder Partitions-Suche noch Signatur-Scan haben ein gueltiges DTB gefunden. Manuelle Pruefung mit 'binwalk' auf das Image noetig."
            exit 1
          fi

      - name: DTB zu DTS dekompilieren
        run: |
          mkdir -p dts_output
          FOUND_DTB=false

          for dtb in dtb_output/*.dtb; do
            [ -f "$dtb" ] || continue
            FOUND_DTB=true
            filename=$(basename -- "$dtb")
            name="${filename%.*}"
            echo "Dekompiliere $filename zu DTS..."
            # -@ erhält Phandle-/Symbol-Referenzen (wichtig für Overlays/Fixups
            # auf Amlogic/Rockchip-Boards). Fehlerausgabe wird mitgeloggt statt
            # nur "Warnung" ohne Details zu schreiben.
            if ! dtc -@ -I dtb -O dts -o "dts_output/${name}.dts" "$dtb" 2> "dts_output/${name}.decompile.log"; then
              echo "::warning::Fehler beim Dekompilieren von $dtb, siehe ${name}.decompile.log"
            fi
          done

          if [ "$FOUND_DTB" = false ]; then
            echo "::error::Keine .dtb Dateien zum Dekompilieren gefunden!"
            exit 1
          fi

      - name: DTS für darkOS-Porting analysieren
        # Ersetzt die alte, einfache awk/grep-Zusammenfassung durch einen
        # klammer-tiefen-genauen Parser: die alte awk-Regel brach bei
        # verschachtelten Kind-Knoten (z.B. gpio-keys mit mehreren
        # "button@N"-Unterknoten), weil sie einfach beim naechsten "};"
        # abgeschnitten hat statt die tatsaechliche Knotengrenze zu
        # verfolgen. Hier wird pro Zeile die Klammertiefe mitgezaehlt,
        # wodurch jeder Knoten inkl. aller Kinder vollstaendig und korrekt
        # extrahiert wird - unabhaengig davon, wie tief er verschachtelt ist.
        run: |
          mkdir -p porting_notes
          cat > /tmp/analyze_dts_for_porting.py << 'PYEOF'
          import sys, os, re, glob

          # (Ueberschrift, [Schluesselwoerter case-insensitive], max. Zeilen pro Knoten)
          CATEGORIES = [
              ("SoC / Board (Root-Eigenschaften)", None, 0),
              ("Speicher (memory-Knoten)", ["memory@", "device_type = \"memory\""], 20),
              ("CPU / Taktstufen (OPP-Tabelle)", ["cpu@", "opp-table", "opp-microvolt", "opp-hz"], 60),
              ("Buttons (gpio-keys / adc-keys)", ["gpio-keys", "gpio_keys", "adc-keys", "adc_keys"], 120),
              ("Analog-Sticks (ADC-Joystick)", ["adc-joystick", "joystick", "abs_x", "abs-x", "abs_y"], 80),
              ("Akku / Ladeschaltung / Fuel-Gauge", ["battery", "charger", "fuel-gauge", "fuel_gauge",
                  "cw2015", "cw2017", "axp", "bq27", "max1704", "rk818", "rk8xx"], 80),
              ("WiFi / Bluetooth", ["wifi", "sdio", "bluetooth", "bt_dev", "brcm", "rtl8", "aml_wifi", "aic8800"], 60),
              ("Audio (Codec / I2S)", ["audio", "codec", "i2s", "es8316", "es8388", "dmic", "sound"], 60),
              ("Display / Panel / Backlight", ["panel", "backlight", "lcd", "dsi", "vout", "hdmi"], 60),
              ("Touchscreen", ["touchscreen", "goodix", "gt9", "ft5", "gslx"], 40),
              ("USB / OTG", ["usb", "otg", "dwc2", "dwc3", "extcon"], 40),
              ("LEDs", ["gpio-leds", "leds {", "led@", "led-"], 40),
              ("RTC (Echtzeituhr)", ["rtc@", "rtc {", "rtc0", "rtc1"], 20),
              ("Sensoren (Gyro / Accel)", ["gyro", "accel", "mpu6", "bma2", "icm4", "qmi8"], 40),
              ("Thermal-Zonen", ["thermal-zone", "thermal_zone", "cooling-maps", "cooling-device"], 60),
              ("Regulatoren (Spannungsversorgung)", ["regulator"], 30),
              ("Pinctrl (Pin-Multiplexing)", ["pinctrl", "pinmux", "pinconf", "pinctrl-0", "iomux"], 40),
          ]

          NODE_OPEN_RE = re.compile(r'^(?P<name>.+?)\s*\{\s*$')
          NODE_CLOSE_RE = re.compile(r'^\}\s*;?\s*$')

          def parse_nodes(lines):
              """Klammertiefen-genaue Extraktion aller Knotenblöcke inkl. Kinder."""
              stack = []
              nodes = []
              for i, raw in enumerate(lines):
                  line = raw.rstrip('\n')
                  stripped = line.strip()
                  for frame in stack:
                      frame['lines'].append(line)
                  m = NODE_OPEN_RE.match(stripped)
                  if m and not stripped.startswith('/*'):
                      stack.append({'name': m.group('name').strip(), 'start': i, 'lines': [line]})
                  elif NODE_CLOSE_RE.match(stripped):
                      if stack:
                          frame = stack.pop()
                          nodes.append({
                              'name': frame['name'],
                              'start': frame['start'],
                              'end': i,
                              'text': '\n'.join(frame['lines']),
                          })
              return nodes

          def extract_root_props(lines):
              # Root-Eigenschaften stehen direkt unter "/ {" auf oberster Ebene,
              # bevor der erste Kind-Knoten geoeffnet wird.
              depth = 0
              props = {}
              for raw in lines:
                  line = raw.strip()
                  if depth == 1:
                      mm = re.match(r'(compatible|model|serial-number)\s*=\s*(.+);', line)
                      if mm:
                          props[mm.group(1)] = mm.group(2)
                  depth += line.count('{') - line.count('}')
              return props

          def render_node(node, max_lines):
              text = node['text']
              text_lines = text.split('\n')
              truncated = False
              if max_lines and len(text_lines) > max_lines:
                  text_lines = text_lines[:max_lines]
                  truncated = True
              body = '\n'.join(text_lines)
              out = f"```dts\n{body}\n"
              if truncated:
                  out += "    // ... (gekuerzt, siehe volle .dts-Datei fuer Rest) ...\n"
              out += "```\n"
              return out

          def analyze(dts_path, outdir):
              with open(dts_path, 'r', errors='replace') as f:
                  lines = f.readlines()

              name = os.path.splitext(os.path.basename(dts_path))[0]
              nodes = parse_nodes(lines)
              root_props = extract_root_props(lines)

              report = [f"# Porting-Notizen: {name}\n"]
              report.append(f"Quelle: `{os.path.basename(dts_path)}`  \n")
              report.append(f"Gefundene Knoten insgesamt: {len(nodes)}\n\n")

              report.append("## SoC / Board (Root-Eigenschaften)\n")
              if root_props:
                  for k, v in root_props.items():
                      report.append(f"- **{k}** = {v}\n")
              else:
                  report.append("_Keine root `compatible`/`model`-Zeile gefunden._\n")
              report.append("\n")

              for title, keywords, max_lines in CATEGORIES:
                  if keywords is None:
                      continue  # Root-Block oben separat behandelt
                  matches = []
                  for node in nodes:
                      if node['name'] == '/':
                          continue  # Root separat oben behandelt, sein Text
                                    # enthaelt sonst den kompletten Baum und
                                    # wuerde in fast jede Kategorie matchen
                      haystack = (node['name'] + '\n' + node['text']).lower()
                      if any(kw.lower() in haystack for kw in keywords):
                          matches.append(node)
                  # Wenn sowohl ein Vorfahre als auch ein spezifisches Kind
                  # matchen (z.B. "gpio-keys" und darin "button@0"), nur den
                  # kleinsten/spezifischsten Knoten behalten - sonst wuerde
                  # der Vorfahre den kompletten (teils riesigen) Teilbaum
                  # nochmal komplett mit ausgeben.
                  matches.sort(key=lambda n: (n['end'] - n['start']))
                  filtered = []
                  for node in matches:
                      if any(a['start'] >= node['start'] and a['end'] <= node['end'] for a in filtered):
                          continue
                      filtered.append(node)
                  filtered.sort(key=lambda n: n['start'])

                  report.append(f"## {title}\n")
                  if not filtered:
                      report.append("_Nichts gefunden._\n\n")
                      continue
                  for node in filtered:
                      report.append(f"### `{node['name']}` (Zeile {node['start']+1}-{node['end']+1})\n")
                      report.append(render_node(node, max_lines))
                      report.append("\n")

              report.append("## Kurze GPIO-Referenzliste (alle `&gpioX ...`)\n")
              gpio_refs = sorted(set(re.findall(r'&gpio[a-z0-9_]*\s*[^;,\n>]*', '\n'.join(lines), re.IGNORECASE)))
              if gpio_refs:
                  for ref in gpio_refs[:200]:
                      report.append(f"- `{ref.strip()}`\n")
                  if len(gpio_refs) > 200:
                      report.append(f"- ... ({len(gpio_refs)-200} weitere, siehe volle .dts-Datei)\n")
              else:
                  report.append("_Keine gefunden._\n")

              out_path = os.path.join(outdir, f"{name}_PORTING_NOTES.md")
              with open(out_path, 'w') as f:
                  f.writelines(report)
              print(f"Geschrieben: {out_path}")

          if __name__ == "__main__":
              dts_dir = sys.argv[1]
              outdir = sys.argv[2]
              os.makedirs(outdir, exist_ok=True)
              any_found = False
              for dts_path in sorted(glob.glob(os.path.join(dts_dir, "*.dts"))):
                  any_found = True
                  analyze(dts_path, outdir)
              if not any_found:
                  print("Keine .dts-Dateien gefunden.")
                  sys.exit(1)
          PYEOF

          python3 /tmp/analyze_dts_for_porting.py dts_output porting_notes

          echo "Inhalt porting_notes/:"
          ls -la porting_notes/

      - name: Ergebnisse als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: rg43v-pro-dts-analysis
          path: |
            dtb_output/
            dts_output/
            porting_notes/
          if-no-files-found: warn

      - name: Extrahierte DTB / DTS / Porting-Notizen ins Repo committen
        # Laedt zusaetzlich zum Artifact (das nach 90 Tagen ablaeuft) eine
        # dauerhafte Kopie direkt ins Repo, damit die Analyse fuer den
        # darkOS-Port-Branch versioniert erhalten bleibt.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DEST="porting/rg43v-pro"
          mkdir -p "$DEST/dtb" "$DEST/dts" "$DEST/notes"

          cp -f dtb_output/*.dtb "$DEST/dtb/" 2>/dev/null || true
          cp -f dts_output/*.dts "$DEST/dts/" 2>/dev/null || true
          cp -f dts_output/*.decompile.log "$DEST/dts/" 2>/dev/null || true
          cp -f porting_notes/*.md "$DEST/notes/" 2>/dev/null || true

          git add "$DEST"
          if git diff --cached --quiet; then
            echo "Keine Aenderungen gegenueber dem Repo-Stand - nichts zu committen."
            exit 0
          fi

          git commit -m "Auto: DTB/DTS-Extraktion RG43V-Pro (Run #${{ github.run_number }})"

          # Rebase gegen den aktuellen Stand, falls zwischenzeitlich jemand
          # anderes gepusht hat, dann erst pushen.
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin "HEAD:${{ github.ref_name }}"

